<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacman</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 448px;
    max-width: 95vw;
    padding: 8px 4px;
    box-sizing: border-box;
    font-size: 18px;
    letter-spacing: 1px;
  }
  #hud .label { color: #ffcc00; font-size: 12px; }
  #hud .val { color: #fff; font-size: 20px; }
  canvas#game {
    background: #000;
    display: block;
    image-rendering: pixelated;
    box-shadow: 0 0 24px rgba(0,80,255,0.3);
    max-width: 95vw;
    height: auto;
  }
  #help {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div><div class="label">SCORE</div><div class="val" id="scoreEl">0</div></div>
    <div style="text-align:center"><div class="label">HIGH SCORE</div><div class="val" id="highEl">0</div></div>
    <div style="text-align:right"><div class="label">LIVES</div><canvas id="livesCanvas" width="90" height="22"></canvas></div>
  </div>
  <canvas id="game" width="448" height="496"></canvas>
  <div id="help">Arrow keys to move &middot; Any key / click to start &middot; Eat all dots to win</div>
</div>
<script>
(function(){
"use strict";

// ---------- Constants ----------
const TILE = 16;
const COLS = 28;
const ROWS = 31;
const W = COLS * TILE;     // 448
const H = ROWS * TILE;     // 496

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const livesCanvas = document.getElementById('livesCanvas');
const livesCtx = livesCanvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const highEl = document.getElementById('highEl');

// Maze legend:
// '#' wall, '.' dot, 'o' power pellet, ' ' empty path, '-' ghost door,
// 'x' tunnel/empty (no dot), 'G' ghost house interior (no dot)
const MAZE = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "######.##### ## #####.######",
  "######.##          ##.######",
  "######.## ###--### ##.######",
  "######.## #GGGGGG# ##.######",
  "x.........#GGGGGG#.........x",
  "######.## #GGGGGG# ##.######",
  "######.## ######## ##.######",
  "######.##          ##.######",
  "######.## ######## ##.######",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##.......  .......##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################"
];

// Build mutable grid for dots
let grid;          // array of arrays of chars
let totalDots;
let dotsLeft;

function buildGrid(){
  grid = MAZE.map(row => row.split(''));
  totalDots = 0;
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const ch = grid[r][c];
      if (ch === '.' || ch === 'o') totalDots++;
    }
  }
  dotsLeft = totalDots;
}

function isWall(c, r){
  if (r<0 || r>=ROWS) return true;
  if (c<0 || c>=COLS) return false; // tunnel openings
  const ch = grid[r][c];
  return ch === '#';
}
function isDoor(c,r){
  if (c<0||c>=COLS||r<0||r>=ROWS) return false;
  return grid[r][c] === '-';
}

// ---------- Audio ----------
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, when){
  if (!audioCtx) return;
  const t0 = (when||0) + audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type||'square';
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.15, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
let wakaToggle = false;
function sndWaka(){
  if (!audioCtx) return;
  wakaToggle = !wakaToggle;
  beep(wakaToggle ? 360 : 240, 0.09, 'square', 0.12);
}
function sndGhostEaten(){
  if (!audioCtx) return;
  for (let i=0;i<6;i++) beep(300 + i*120, 0.06, 'square', 0.14, i*0.05);
}
function sndPower(){
  if (!audioCtx) return;
  for (let i=0;i<8;i++) beep(180 + (i%2?80:0), 0.08, 'sawtooth', 0.1, i*0.06);
}
function sndDeath(){
  if (!audioCtx) return;
  for (let i=0;i<14;i++) beep(700 - i*45, 0.1, 'square', 0.13, i*0.08);
}
function sndStart(){
  if (!audioCtx) return;
  const notes=[523,659,784,659,784,1046];
  notes.forEach((n,i)=>beep(n,0.15,'square',0.12,i*0.15));
}

// ---------- Game entities ----------
const DIRS = {
  left:  {x:-1, y:0},
  right: {x: 1, y:0},
  up:    {x: 0, y:-1},
  down:  {x: 0, y:1},
  none:  {x: 0, y:0}
};
const OPPOSITE = { left:'right', right:'left', up:'down', down:'up', none:'none' };

function tileCenterX(c){ return c*TILE + TILE/2; }
function tileCenterY(r){ return r*TILE + TILE/2; }

// Pacman
const pac = {
  x:0, y:0, dir:'left', next:'left', speed:1.55,
  mouth:0, mouthDir:1, dead:false, deathTimer:0
};

function resetPac(){
  pac.x = tileCenterX(13) + TILE/2; // between 13 and 14
  pac.y = tileCenterY(23);
  pac.dir = 'left'; pac.next = 'left';
  pac.dead = false; pac.deathTimer = 0; pac.mouth = 0.2; pac.mouthDir = 1;
}

// Ghost factory
function makeGhost(name, color, scatterTile){
  return {
    name, color,
    x: 0, y: 0,
    dir: 'left', speed: 1.4,
    mode: 'scatter',     // scatter | chase | frightened | eaten
    frightened: false,
    inHouse: false,
    scatterTile,
    releaseAt: 0
  };
}

let ghosts;
function resetGhosts(){
  ghosts = [
    makeGhost('blinky', '#ff0000', {c:25,r:0}),
    makeGhost('pinky',  '#ffb8ff', {c:2,r:0}),
    makeGhost('inky',   '#00ffff', {c:27,r:30}),
    makeGhost('clyde',  '#ffb851', {c:0,r:30})
  ];
  // blinky starts just above the house
  ghosts[0].x = tileCenterX(13)+TILE/2; ghosts[0].y = tileCenterY(11); ghosts[0].inHouse=false;
  ghosts[1].x = tileCenterX(13)+TILE/2; ghosts[1].y = tileCenterY(14); ghosts[1].inHouse=true;
  ghosts[2].x = tileCenterX(11)+TILE/2; ghosts[2].y = tileCenterY(14); ghosts[2].inHouse=true;
  ghosts[3].x = tileCenterX(15)+TILE/2; ghosts[3].y = tileCenterY(14); ghosts[3].inHouse=true;
  ghosts[1].releaseAt = 60;
  ghosts[2].releaseAt = 180;
  ghosts[3].releaseAt = 360;
}

// ---------- Game state ----------
let state = 'ready'; // ready | playing | dead | win | gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('pac_high')||'0',10) || 0;
let lives = 3;
let frightTimer = 0;
const FRIGHT_DURATION = 420; // ~7s at 60fps
let ghostEatChain = 0;
let modeTimer = 0;
let globalFrame = 0;
let readyTimer = 0;
let popups = [];
let stateTimer = 0;
let levelSpeed = 0;

function setHigh(){
  if (score > highScore){ highScore = score; localStorage.setItem('pac_high', String(highScore)); }
}

function newGame(){
  buildGrid();
  score = 0; lives = 3; state='ready'; readyTimer = 120;
  frightTimer = 0; ghostEatChain = 0; modeTimer = 0; popups = []; levelSpeed = 0;
  resetPac(); resetGhosts();
  updateHud();
  sndStart();
}

function startLifeReset(){
  resetPac(); resetGhosts();
  frightTimer = 0; ghostEatChain = 0; modeTimer = 0;
  state = 'ready'; readyTimer = 90;
}

function updateHud(){
  scoreEl.textContent = score;
  highEl.textContent = highScore;
  drawLives();
}

function drawLives(){
  livesCtx.clearRect(0,0,livesCanvas.width,livesCanvas.height);
  for (let i=0;i<lives;i++){
    const cx = 11 + i*24, cy = 11, rad = 9;
    livesCtx.fillStyle = '#ffe600';
    livesCtx.beginPath();
    livesCtx.moveTo(cx,cy);
    livesCtx.arc(cx,cy,rad, 0.25*Math.PI, 1.75*Math.PI);
    livesCtx.closePath();
    livesCtx.fill();
  }
}

// ---------- Movement helpers ----------
function curTile(ent){
  return { c: Math.floor(ent.x / TILE), r: Math.floor(ent.y / TILE) };
}
function canMove(c, r, dir, allowDoor){
  const d = DIRS[dir];
  let nc = c + d.x, nr = r + d.y;
  if (nc < 0) nc = COLS-1;
  if (nc >= COLS) nc = 0;
  if (isDoor(nc,nr)) return !!allowDoor;
  return !isWall(nc,nr);
}

function moveEntity(ent, speed){
  const d = DIRS[ent.dir];
  ent.x += d.x * speed;
  ent.y += d.y * speed;
  if (ent.x < -TILE/2) ent.x = W + TILE/2;
  if (ent.x > W + TILE/2) ent.x = -TILE/2;
}

// ---------- Pacman update ----------
function updatePac(){
  if (pac.dead) return;
  const t = curTile(pac);
  const centeredX = Math.abs(pac.x - tileCenterX(t.c)) < pac.speed;
  const centeredY = Math.abs(pac.y - tileCenterY(t.r)) < pac.speed;

  if (centeredX && centeredY){
    if (pac.next !== pac.dir && canMove(t.c, t.r, pac.next, false)){
      pac.x = tileCenterX(t.c); pac.y = tileCenterY(t.r);
      pac.dir = pac.next;
    }
    if (!canMove(t.c, t.r, pac.dir, false)){
      pac.x = tileCenterX(t.c); pac.y = tileCenterY(t.r);
      pac.mouth = 0.2;
      eatHere(t);
      return;
    }
  }
  moveEntity(pac, pac.speed);
  pac.mouth += pac.mouthDir * 0.18;
  if (pac.mouth > 0.55){ pac.mouth = 0.55; pac.mouthDir = -1; }
  if (pac.mouth < 0.02){ pac.mouth = 0.02; pac.mouthDir = 1; }
  eatHere(curTile(pac));
}

function eatHere(t){
  if (t.c<0||t.c>=COLS||t.r<0||t.r>=ROWS) return;
  const ch = grid[t.r][t.c];
  if (ch === '.'){
    grid[t.r][t.c] = ' ';
    score += 10; dotsLeft--;
    sndWaka();
    setHigh(); updateHud();
  } else if (ch === 'o'){
    grid[t.r][t.c] = ' ';
    score += 50; dotsLeft--;
    triggerFright();
    sndPower();
    setHigh(); updateHud();
  }
  if (dotsLeft <= 0 && state==='playing'){
    state = 'win'; stateTimer = 0; setHigh(); updateHud();
  }
}

function triggerFright(){
  frightTimer = FRIGHT_DURATION;
  ghostEatChain = 0;
  for (const g of ghosts){
    if (g.mode !== 'eaten' && !g.inHouse){
      g.frightened = true;
      g.mode = 'frightened';
      g.dir = OPPOSITE[g.dir] || g.dir;
    } else if (g.mode !== 'eaten'){
      g.frightened = true;
      g.mode = 'frightened';
    }
  }
}

// ---------- Ghost AI ----------
function ghostTargetTile(g){
  const pt = curTile(pac);
  if (g.mode === 'scatter') return g.scatterTile;
  if (g.mode === 'eaten') return {c:13, r:11};
  switch(g.name){
    case 'blinky':
      return {c:pt.c, r:pt.r};
    case 'pinky': {
      const d = DIRS[pac.dir];
      return {c: pt.c + d.x*4, r: pt.r + d.y*4};
    }
    case 'inky': {
      const d = DIRS[pac.dir];
      const ahead = {c: pt.c + d.x*2, r: pt.r + d.y*2};
      const b = curTile(ghosts[0]);
      return {c: ahead.c + (ahead.c - b.c), r: ahead.r + (ahead.r - b.r)};
    }
    case 'clyde': {
      const gt = curTile(g);
      const dist = Math.hypot(gt.c-pt.c, gt.r-pt.r);
      return dist > 8 ? {c:pt.c, r:pt.r} : g.scatterTile;
    }
  }
  return {c:pt.c, r:pt.r};
}

function ghostChooseDir(g){
  const t = curTile(g);
  const opts = ['up','left','down','right'];
  const allowDoor = (g.mode === 'eaten');

  if (g.mode === 'frightened'){
    const valid = opts.filter(dir =>
      dir !== OPPOSITE[g.dir] && canMove(t.c,t.r,dir,allowDoor));
    const pool = valid.length ? valid : opts.filter(dir=>canMove(t.c,t.r,dir,allowDoor));
    if (pool.length) g.dir = pool[Math.floor(Math.random()*pool.length)];
    return;
  }

  const target = ghostTargetTile(g);
  let best = null, bestDist = Infinity;
  for (const dir of opts){
    if (dir === OPPOSITE[g.dir]) continue;
    if (!canMove(t.c, t.r, dir, allowDoor)) continue;
    const d = DIRS[dir];
    const nc = t.c + d.x, nr = t.r + d.y;
    const dist = (nc-target.c)*(nc-target.c)+(nr-target.r)*(nr-target.r);
    if (dist < bestDist){ bestDist = dist; best = dir; }
  }
  if (best){ g.dir = best; }
  else if (canMove(t.c,t.r,OPPOSITE[g.dir],allowDoor)) g.dir = OPPOSITE[g.dir];
}

function updateGhost(g){
  if (g.inHouse){
    g.releaseAt--;
    if (g.releaseAt <= 0){
      g.inHouse = false;
      g.x = tileCenterX(13)+TILE/2;
      g.y = tileCenterY(11);
      g.dir = 'left';
      if (frightTimer>0){ g.frightened=true; g.mode='frightened'; }
    } else {
      g.y = tileCenterY(14) + Math.sin(globalFrame*0.1)*2;
      return;
    }
  }

  if (g.mode === 'eaten'){
    if (Math.abs(g.x-(tileCenterX(13)+TILE/2))<TILE*0.6 && Math.abs(g.y-tileCenterY(11))<TILE*0.6){
      g.mode = 'scatter'; g.frightened=false;
    }
  }

  let speed = g.speed + levelSpeed;
  if (g.mode === 'frightened') speed = (g.speed)*0.55;
  if (g.mode === 'eaten') speed = (g.speed+levelSpeed)*1.8;
  const tt = curTile(g);
  if ((tt.c<=1 || tt.c>=COLS-2) && tt.r===14) speed *= 0.6;

  const centeredX = Math.abs(g.x - tileCenterX(tt.c)) < Math.max(speed,1.5);
  const centeredY = Math.abs(g.y - tileCenterY(tt.r)) < Math.max(speed,1.5);
  if (centeredX && centeredY){
    g.x = tileCenterX(tt.c); g.y = tileCenterY(tt.r);
    ghostChooseDir(g);
  }
  moveEntity(g, speed);
}

function updateGhostModes(){
  if (frightTimer > 0){
    frightTimer--;
    if (frightTimer === 0){
      for (const g of ghosts){
        if (g.mode === 'frightened'){ g.mode = 'chase'; g.frightened = false; }
      }
    }
  }
  modeTimer++;
  const cyclePos = modeTimer % (27*60);
  const wantScatter = cyclePos < 7*60;
  for (const g of ghosts){
    if (g.mode==='frightened'||g.mode==='eaten'||g.inHouse) continue;
    g.mode = wantScatter ? 'scatter' : 'chase';
  }
}

// ---------- Collisions ----------
function checkCollisions(){
  if (pac.dead) return;
  for (const g of ghosts){
    if (g.inHouse) continue;
    const dist = Math.hypot(g.x-pac.x, g.y-pac.y);
    if (dist < TILE*0.7){
      if (g.mode === 'frightened'){
        ghostEatChain++;
        const pts = [200,400,800,1600][Math.min(ghostEatChain-1,3)];
        score += pts; setHigh(); updateHud();
        popups.push({x:g.x, y:g.y, text:String(pts), timer:60});
        g.mode = 'eaten'; g.frightened = false;
        sndGhostEaten();
      } else if (g.mode === 'eaten'){
        // ignore
      } else {
        pac.dead = true; pac.deathTimer = 0;
        state = 'dead';
        sndDeath();
        return;
      }
    }
  }
}

// ---------- Update loop ----------
function update(){
  globalFrame++;
  if (state === 'ready'){
    readyTimer--;
    if (readyTimer <= 0) state = 'playing';
    return;
  }
  if (state === 'dead'){
    pac.deathTimer++;
    pac.mouth = Math.min(0.98, pac.deathTimer/55);
    if (pac.deathTimer > 75){
      lives--;
      updateHud();
      if (lives <= 0){ state = 'gameover'; stateTimer = 0; setHigh(); }
      else startLifeReset();
    }
    return;
  }
  if (state === 'win'){
    stateTimer++;
    if (stateTimer > 150){
      buildGrid(); resetPac(); resetGhosts();
      levelSpeed += 0.1;
      state='ready'; readyTimer=90;
    }
    return;
  }
  if (state === 'gameover'){ stateTimer++; return; }

  updatePac();
  updateGhostModes();
  for (const g of ghosts) updateGhost(g);
  checkCollisions();

  for (const p of popups){ p.timer--; p.y -= 0.3; }
  popups = popups.filter(p=>p.timer>0);
}

// ---------- Rendering ----------
function drawMaze(){
  ctx.lineWidth = 2;
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const ch = grid[r][c];
      const x = c*TILE, y = r*TILE;
      if (ch === '#'){
        drawWallTile(c,r,x,y);
      } else if (ch === '-'){
        ctx.fillStyle = '#ff9cce';
        ctx.fillRect(x, y+TILE/2-1, TILE, 3);
      } else if (ch === '.'){
        ctx.fillStyle = '#ffb8a0';
        ctx.beginPath();
        ctx.arc(x+TILE/2, y+TILE/2, 2, 0, Math.PI*2);
        ctx.fill();
      } else if (ch === 'o'){
        const pr = 5 + Math.sin(globalFrame*0.2)*1.2;
        ctx.fillStyle = '#ffb8a0';
        ctx.beginPath();
        ctx.arc(x+TILE/2, y+TILE/2, pr, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
}

function drawWallTile(c,r,x,y){
  ctx.strokeStyle = '#2121ff';
  const up = isWall(c,r-1), down = isWall(c,r+1), left = isWall(c-1,r), right = isWall(c+1,r);
  const cx = x+TILE/2, cy = y+TILE/2;
  ctx.beginPath();
  if (left || right){
    const x0 = left ? x : cx;
    const x1 = right ? x+TILE : cx;
    ctx.moveTo(x0, cy); ctx.lineTo(x1, cy);
  }
  if (up || down){
    const y0 = up ? y : cy;
    const y1 = down ? y+TILE : cy;
    ctx.moveTo(cx, y0); ctx.lineTo(cx, y1);
  }
  if (!up && !down && !left && !right){
    ctx.arc(cx,cy,2,0,Math.PI*2);
  }
  ctx.stroke();
}

function drawPacman(){
  ctx.save();
  ctx.translate(pac.x, pac.y);
  let ang = 0;
  if (pac.dir==='right') ang=0;
  else if (pac.dir==='down') ang=Math.PI/2;
  else if (pac.dir==='left') ang=Math.PI;
  else if (pac.dir==='up') ang=-Math.PI/2;
  ctx.rotate(ang);
  const m = pac.mouth * Math.PI;
  ctx.fillStyle = '#ffe600';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0, TILE*0.55, m, Math.PI*2 - m);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGhost(g){
  const fright = (g.mode==='frightened');
  const eaten = (g.mode==='eaten');
  const x = g.x, y = g.y, rad = TILE*0.55;
  const blink = fright && frightTimer < 120 && Math.floor(globalFrame/12)%2===0;
  let body = g.color;
  if (fright) body = blink ? '#ffffff' : '#2121ff';

  if (!eaten){
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y-2, rad, Math.PI, 0);
    ctx.lineTo(x+rad, y+rad-2);
    const n=3, w=(rad*2)/n;
    for (let i=0;i<n;i++){
      const sx = x+rad - i*w;
      ctx.lineTo(sx - w/2, y+rad-2 - 3);
      ctx.lineTo(sx - w, y+rad-2);
    }
    ctx.lineTo(x-rad, y-2);
    ctx.closePath();
    ctx.fill();
  }

  const lookX = DIRS[g.dir].x, lookY = DIRS[g.dir].y;
  if (fright){
    const fc = blink ? '#ff0000' : '#ffcc22';
    ctx.fillStyle = fc;
    ctx.beginPath(); ctx.arc(x-4, y-3, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4, y-3, 2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = fc; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x-5,y+4); ctx.lineTo(x-2,y+2); ctx.lineTo(x+1,y+4); ctx.lineTo(x+4,y+2); ctx.lineTo(x+6,y+4);
    ctx.stroke();
  } else {
    for (const ex of [-4,4]){
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(x+ex, y-3, 3, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0000cc';
      ctx.beginPath(); ctx.arc(x+ex+lookX*1.5, y-3+lookY*1.5, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawPopups(){
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  for (const p of popups){
    ctx.globalAlpha = Math.min(1, p.timer/30);
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawCenterText(lines, color){
  ctx.textAlign='center';
  ctx.fillStyle = color||'#ffcc00';
  ctx.font = 'bold 22px monospace';
  let yy = H/2 - (lines.length-1)*16;
  for (const ln of lines){ ctx.fillText(ln, W/2, yy); yy += 30; }
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawMaze();
  for (const g of ghosts) drawGhost(g);

  if (state==='dead'){
    ctx.save();
    ctx.translate(pac.x,pac.y);
    ctx.fillStyle='#ffe600';
    const m = pac.mouth*Math.PI;
    if (m < Math.PI){
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,TILE*0.55, -Math.PI/2 + m, -Math.PI/2 - m + Math.PI*2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  } else {
    drawPacman();
  }

  drawPopups();

  if (state==='ready') drawCenterText(['READY!'], '#ffcc00');
  else if (state==='win') drawCenterText(['LEVEL CLEARED!'], '#00ff66');
  else if (state==='gameover') drawCenterText(['GAME OVER','Press any key'], '#ff3030');
}

// ---------- Main loop ----------
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

// ---------- Input ----------
window.addEventListener('keydown', (e)=>{
  ensureAudio();
  const k = e.key;
  if (k==='ArrowLeft'){ pac.next='left'; e.preventDefault(); }
  else if (k==='ArrowRight'){ pac.next='right'; e.preventDefault(); }
  else if (k==='ArrowUp'){ pac.next='up'; e.preventDefault(); }
  else if (k==='ArrowDown'){ pac.next='down'; e.preventDefault(); }
  else if (state==='gameover'){ newGame(); }
});
canvas.addEventListener('click', ()=>{
  ensureAudio();
  if (state==='gameover') newGame();
});
document.addEventListener('click', ()=> ensureAudio(), {once:true});

// ---------- Boot ----------
buildGrid();
newGame();
updateHud();
loop();

})();
</script>
</body>
