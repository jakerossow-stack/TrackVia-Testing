<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacman</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 4px 8px;
    font-size: 14px;
    letter-spacing: 1px;
  }
  #scoreSection, #highScoreSection { text-align: center; min-width: 120px; }
  .scoreLabel { color: #fff; font-size: 11px; letter-spacing: 2px; }
  .scoreValue { color: #fff; font-size: 20px; font-weight: bold; }
  #canvas { display: block; border: 0; image-rendering: pixelated; }
  #bottomBar {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 4px 8px;
    gap: 6px;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    z-index: 10;
  }
  #overlay h1 { font-size: 36px; color: #FFD700; letter-spacing: 4px; margin-bottom: 10px; }
  #overlay h2 { font-size: 22px; color: #FF0000; letter-spacing: 3px; margin-bottom: 20px; }
  #overlay p  { font-size: 14px; color: #fff; letter-spacing: 2px; margin-bottom: 8px; }
  #overlay .blink { animation: blink 0.8s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #restartBtn {
    margin-top: 16px;
    padding: 10px 30px;
    font-size: 16px;
    background: #FFD700;
    color: #000;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 2px;
    font-weight: bold;
  }
  #restartBtn:hover { background: #FFA500; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="topBar">
    <div id="scoreSection">
      <div class="scoreLabel">SCORE</div>
      <div class="scoreValue" id="scoreDisplay">0</div>
    </div>
    <div id="highScoreSection">
      <div class="scoreLabel">HIGH SCORE</div>
      <div class="scoreValue" id="highScoreDisplay">0</div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="bottomBar">
    <canvas id="livesCanvas" width="150" height="24"></canvas>
  </div>
  <div id="overlay" style="display:none;">
    <h1 id="overlayTitle"></h1>
    <h2 id="overlaySubtitle"></h2>
    <p id="overlayMsg"></p>
    <p class="blink" id="overlayPrompt"></p>
    <button id="restartBtn" onclick="restartGame()">PLAY AGAIN</button>
  </div>
</div>
<script>
